pool:
    vmImage: 'windows-2022'
steps:
    - checkout: self
      submodules: true
    - task: UseDotNet@2
      displayName: Use .NET SDK
      inputs:
          packageType: sdk
          version: 10.0.104
    - task: CmdLine@2
      displayName: Install workload
      inputs:
          script: dotnet workload install ios android wasm-tools macos
    - task: DotNetCoreCLI@2
      inputs:
          command: test
    - task: DotNetCoreCLI@2
      displayName: Pack
      inputs:
          packagesToPack: src/**/*.csproj
          command: pack
          outputDir: $(Build.ArtifactStagingDirectory)/NuGet
          verbosityPack: normal
    # Generates a per-package CycloneDX SBOM (EU CRA evidence) and embeds it into each .nupkg,
    # so it must run after Pack and before the packages are published.
    - task: CmdLine@2
      displayName: Generate SBOMs
      inputs:
          script: dotnet run --project build/_build.csproj -- --packages "$(Build.ArtifactStagingDirectory)/NuGet" --output "$(Build.ArtifactStagingDirectory)/SBOM"
    - task: PublishBuildArtifacts@1
      displayName: Publish Build Artifacts
      inputs:
          pathtoPublish: $(Build.ArtifactStagingDirectory)/NuGet
          artifactName: NuGet
      condition: succeeded()
    - task: PublishBuildArtifacts@1
      displayName: Publish SBOM Artifacts
      inputs:
          pathtoPublish: $(Build.ArtifactStagingDirectory)/SBOM
          artifactName: SBOM
      condition: succeeded()
